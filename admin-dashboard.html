<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Overview · CampusFind</title>
<meta name="description" content="CampusFind — the campus-only marketplace for student products and services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=localStorage.getItem('cf_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="admin-dashboard" data-layout="admin">
<a class="skip" href="#main">Skip to content</a>
<div class="admin-shell">
<aside class="sidebar" id="admin-sidebar" aria-label="Admin navigation"></aside>
<div class="admin-main">
<div class="admin-top" id="admin-top"></div>
<main id="main" class="admin-content">

<div class="admin-title"><div><h1>Overview</h1><p class="muted">What’s happening on CampusFind today.</p></div><a class="btn btn-primary" href="admin-listings.html?status=pending">Review pending</a></div>
<div class="stats" id="stats"></div>
<div class="two-col">
  <section class="panel"><h2>New listings per month</h2><div class="bars" id="bars" role="img" aria-label="Bar chart of new listings per month"></div></section>
  <section class="panel"><h2>Listings by category</h2><div class="donut" id="donut" role="img" aria-label="Donut chart of listings by category"></div><ul class="legend" id="legend"></ul></section>
</div>
<div class="two-col">
  <section><h2>Pending listings</h2><div class="table-wrap"><table class="responsive"><thead><tr><th>Listing</th><th>Category</th><th>Price</th><th>Status</th><th>Submitted</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="pending-rows"></tbody></table></div></section>
  <section class="panel"><h2>Recent activity</h2><ul class="activity" id="activity"></ul></section>
</div>

</main>
</div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
